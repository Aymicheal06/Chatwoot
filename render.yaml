services:
  - type: web
    name: chatwoot-web
    env: ruby
    plan: free
    branch: develop
    buildCommand: bundle install && yarn install && RAILS_ENV=production bundle exec rake assets:precompile
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: FRONTEND_URL
        value: https://chatwoot-uxaj.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chatwoot-redis
          type: redis
          property: connectionString

  - name: chatwoot-redis
    type: redis
    plan: free
    ipAllowList: []

databases:
  - name: chatwoot-db
    plan: free

